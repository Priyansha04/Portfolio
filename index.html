<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priyansha's Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
        }
        p {
            font-size: 1.2rem;
            margin: 10px 0 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 1rem;
            color: white;
            background: #ff8c00;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff6500;
        }
        .menu {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .menu-button {
            background: #ff8c00;
            border: none;
            padding: 10px 15px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }
        .menu-content {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            position: absolute;
            top: 40px;
            left: 0;
            width: 150px;
        }
        .menu-content a {
            display: block;
            color: white;
            padding: 5px;
            text-decoration: none;
        }
        .menu-content a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
    <script>
        function toggleMenu() {
            var menu = document.getElementById("menu-content");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
    </script>
</head>
<body>
    <div class="menu">
        <button class="menu-button" onclick="toggleMenu()">☰ Menu</button>
        <div class="menu-content" id="menu-content">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="internships.html">Internships</a>
            <a href="about.html">About Me</a>
        </div>
    </div>
    <div class="container">
        <h1>Hi, I'm Priyansha</h1>
        <p>Engineering Student | Robotics Enthusiast | Researcher</p>
        <a href="projects.html" class="btn">Explore My Work</a>
    </div>
</body>
</html>
